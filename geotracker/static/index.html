<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Share your location</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            line-height: 1.5;
            margin: 3rem auto;
            max-width: 38rem;
            padding: 0 1rem;
        }

        button {
            cursor: pointer;
            font: inherit;
            padding: 0.6rem 1rem;
        }

        button:disabled {
            cursor: wait;
        }
    </style>
</head>
<body>
    <main>
        <h1>Share your location</h1>
        <p>
            This page requests your device location. If you grant browser
            permission, your coordinates will be sent to the server and printed
            in its console.
        </p>
        <button id="share-location" type="button">Request location again</button>
        <p id="status" role="status" aria-live="polite">
            Requesting browser location permission...
        </p>
    </main>
    <script src="/app.js" defer></script>
</body>
</html>
